[project]
name = "nfl-bot"
version = "0.1.0"
description = "Poverty Franchises league bot — nags people who haven't joined Sleeper yet"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.setuptools]
py-modules = ["bot", "config", "sleeper", "shame", "views", "web"]
